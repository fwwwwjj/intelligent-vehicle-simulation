name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          # 核心链路只需要 numpy；pandas 用于 highD 解析测试；pyyaml 用于 YAML 场景。
          # scipy/matplotlib 在核心测试中是可选的（LQR 有 numpy fallback，可视化不参与测试）。
          pip install "numpy>=1.23,<=2.0.2" "pandas>=1.5,<=2.2.3" "pyyaml>=6.0,<=6.0.2"

      - name: Run unit tests (low power)
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -B -m unittest discover tests -v

      - name: Run core smoke benchmark (6 s)
        # 6 s 而非 5 s：cut_in 的任务判据要求观察窗 >= 5.0 s，5 s 跑到 t=4.95
        # 必然报 success=0，容易被误读为回归。
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -B scripts/run_benchmark.py \
            --scenarios highway_merge cut_in emergency_avoidance \
            --decisions fsm --seeds 42 --duration 6.0 \
            --output-dir /tmp/siac_ci

      - name: Check benchmark provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/siac_ci/benchmark.json').read_text(encoding='utf-8'))
          meta = payload['metadata']
          assert 'git_commit' in meta
          assert 'git_dirty' in meta
          assert meta['scenario_sha256'], 'scenario fingerprints missing'
          print('provenance ok:', meta['git_commit'], 'dirty=', meta['git_dirty'])
          PY
